<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bavli Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <canvas id="canvas" style="touch-action: none;"></canvas>
  <div id="controls">
    <label>Overlay</label>
    <select id="overlay-select">
      <option value="none">None</option>
      <option value="segment-length">Segment Length</option>
    </select>
    <div id="overlay-controls"></div>
    <div id="overlay-legend"></div>
  </div>
  <div id="verse-sidebar">
    <div class="bottom-sheet-handle"><span></span></div>
    <div class="verse-ref"><span class="ref-text"></span><button class="close-btn">&times;</button></div>
    <div class="overlay-info"></div>
    <div class="verse-hebrew"></div>
    <a class="sefaria-link" href="#" target="_blank" rel="noopener">
      View on Sefaria
      <span class="link-subtitle"></span>
    </a>
  </div>
  <script type="module" src="/src/main-talmud.ts"></script>
</body>
</html>
