<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Keyboard outline -->
  <rect x="2" y="6" width="20" height="12" rx="2" ry="2"/>

  <!-- Top row keys -->
  <line x1="5" y1="9" x2="6" y2="9"/>
  <line x1="8" y1="9" x2="9" y2="9"/>
  <line x1="11" y1="9" x2="12" y2="9"/>
  <line x1="14" y1="9" x2="15" y2="9"/>
  <line x1="17" y1="9" x2="18" y2="9"/>

  <!-- Middle row keys -->
  <line x1="5" y1="12" x2="6" y2="12"/>
  <line x1="8" y1="12" x2="9" y2="12"/>
  <line x1="11" y1="12" x2="12" y2="12"/>
  <line x1="14" y1="12" x2="15" y2="12"/>
  <line x1="17" y1="12" x2="18" y2="12"/>

  <!-- Spacebar -->
  <line x1="8" y1="15" x2="16" y2="15"/>
</svg>
