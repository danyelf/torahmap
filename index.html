<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Torahmap</title>
    <meta
      name="description"
      content="Every verse of the Hebrew Bible laid out as a colored square. Search, commentary and haftarah readings light up patterns across the whole Tanakh at once."
    />
    <link rel="canonical" href="https://torahmap.org/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Torahmap" />
    <meta property="og:title" content="Torahmap" />
    <meta
      property="og:description"
      content="Every verse of the Hebrew Bible laid out as a colored square. Search, commentary and haftarah readings light up patterns across the whole Tanakh at once."
    />
    <meta property="og:url" content="https://torahmap.org/" />
    <meta property="og:image" content="https://torahmap.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The five books of the Torah above the first books of the Prophets, each verse a small square colored by how much commentary it has."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=David+Libre:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <noscript>
      <p>
        Torahmap lays out all 23,000 verses of the Hebrew Bible — Torah, Prophets and Writings — as
        colored squares, each in a fixed place, so that search results, commentary and haftarah
        readings show their patterns across the whole text. It needs JavaScript and WebGL.
      </p>
    </noscript>
    <canvas id="canvas" style="touch-action: none"></canvas>

    <div id="zoom-controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">&minus;</button>
    </div>

    <div id="verse-popup">
      <div class="verse-ref">
        <span class="ref-text"></span>
        <a class="sefaria-link" href="#" target="_blank" rel="noopener">
          View on Sefaria
          <svg
            viewBox="0 0 24 24"
            width="11"
            height="11"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>
        <button class="close-btn">&times;</button>
      </div>
      <div class="overlay-info"></div>
      <div class="verse-hebrew"></div>
      <div class="verse-english"></div>
    </div>

    <div id="right-panel">
      <button
        id="sheet-grabber"
        type="button"
        aria-label="Make the panel taller or shorter"
      ></button>
      <button id="controls-toggle" type="button" aria-controls="panel-controls">
        <span id="controls-summary"></span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="panel-controls">
        <div class="panel-controls-inner">
          <div class="panel-picker">
            <label for="overlay-select">Overlay</label>
            <!-- The overlays themselves are added here at startup, from the
               registry. Do not list them: that is what the registry is for. -->
            <select id="overlay-select">
              <option value="none">None</option>
            </select>
          </div>
          <div id="overlay-controls"></div>
          <div id="overlay-legend"></div>
        </div>
      </div>

      <button id="story-strip" type="button" aria-controls="story-content">
        <span class="chevron" aria-hidden="true"></span>
        <span id="story-strip-title"></span>
      </button>
      <div id="story-content"></div>
      <svg id="story-cue" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="1,2 9,50 1,98" />
      </svg>

      <footer id="panel-footer">
        <button id="leave-story" class="footer-link" type="button">Leave story</button>
        <button id="return-to-story" class="footer-link" type="button">Return to story</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
