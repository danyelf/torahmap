<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Torahmap</title>
    <meta name="description" content="A Visual Concordance of the Hebrew Bible." />
    <link rel="canonical" href="https://torahmap.org/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Torahmap" />
    <meta property="og:title" content="Torahmap" />
    <meta property="og:description" content="A Visual Concordance of the Hebrew Bible." />
    <meta property="og:url" content="https://torahmap.org/" />
    <meta property="og:image" content="https://torahmap.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The five books of the Torah above the first books of the Prophets, each verse a small square colored by how much commentary it has."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=David+Libre:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-mode="story">
    <noscript>
      <p>
        Torahmap lays out all 23,000 verses of the Hebrew Bible — Torah, Prophets and Writings — as
        colored squares, each in a fixed place, so that search results, commentary and haftarah
        readings show their patterns across the whole text. It needs JavaScript and WebGL.
      </p>
    </noscript>
    <canvas id="canvas" style="touch-action: none"></canvas>

    <button
      id="menu-toggle"
      class="menu-button"
      type="button"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="menu"
    >
      ☰
    </button>

    <div id="menu" class="menu" hidden></div>
    <div id="share-status" class="visually-hidden" role="status" aria-live="polite"></div>

    <div id="zoom-controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">&minus;</button>
    </div>

    <div id="verse-popup">
      <div class="verse-ref">
        <span class="ref-text"></span>
        <a class="sefaria-link" href="#" target="_blank" rel="noopener">
          View on Sefaria
          <svg
            viewBox="0 0 24 24"
            width="11"
            height="11"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>
        <button class="close-btn">&times;</button>
      </div>
      <div class="overlay-info"></div>
      <div class="verse-hebrew"></div>
      <div class="verse-english"></div>
    </div>

    <div id="map-legend" hidden>
      <button class="map-legend-row" type="button" data-panel="search" hidden>
        <span class="map-legend-summary"></span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <button class="map-legend-row" type="button" data-panel="overlay" hidden>
        <span class="map-legend-summary"></span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </div>

    <aside id="panel">
      <button
        id="sheet-grabber"
        type="button"
        aria-label="Make the panel taller or shorter"
      ></button>

      <section id="story" aria-label="Story">
        <div class="column-head">
          <div id="story-progress" role="progressbar" aria-label="Story progress" aria-valuemin="1">
            <div id="story-progress-fill"></div>
          </div>
          <button class="panel-close" type="button" aria-label="Close the story">&times;</button>
        </div>
        <div id="story-content"></div>
        <svg id="story-cue" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true">
          <polyline points="1,2 9,50 1,98" />
        </svg>
      </section>

      <section id="tools">
        <div class="column-head">
          <h2 id="tools-title" class="column-title"></h2>
          <button class="panel-close" type="button" aria-label="Close the panel">&times;</button>
        </div>
        <div id="panel-body">
          <div id="search-panel" class="tool"></div>
          <div id="overlay-panel" class="tool"></div>
          <div id="stories-panel" class="tool"></div>
          <div id="about-panel" class="tool"></div>
        </div>
      </section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
