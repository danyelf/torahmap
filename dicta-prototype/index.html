<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Torah Map - Meaning Filter Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a1a;
      --panel: #232323;
      --panel-2: #1e1e1e;
      --line: #333;
      --text: #ddd;
      --muted: #888;
      --dim: #666;
      --accent: #6ab0f3;
      --hebrew: 'SBL Hebrew', 'Times New Roman', serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

    /* ---------- header ---------- */

    header {
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background: var(--panel-2);
    }

    header h1 { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }
    header h1 span { display: block; font-size: 10px; font-weight: 400; color: var(--dim); }

    .scenarios { display: flex; gap: 6px; }
    .scenarios button {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-family: var(--hebrew);
      font-size: 17px;
      direction: rtl;
    }
    .scenarios button:hover { border-color: var(--accent); }
    .scenarios button .cap {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 9px;
      color: var(--dim);
      direction: ltr;
    }

    #corpus-stat {
      font-size: 11px; color: var(--dim); max-width: 340px; line-height: 1.5;
      border-left: 2px solid var(--line); padding-left: 12px;
    }
    #corpus-stat b { color: var(--muted); font-weight: 600; }

    /* ---------- body ---------- */

    #body { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }

    #terms-col {
      border-right: 1px solid var(--line);
      display: grid; grid-template-rows: auto 1fr; min-height: 0;
      background: var(--panel-2);
    }

    .col-head { padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .col-head h2 { font-size: 12px; font-weight: 600; }
    .col-head .sub { font-size: 10px; color: var(--dim); margin-top: 3px; line-height: 1.5; }

    #add-row { display: flex; gap: 6px; margin-top: 8px; }
    #add-term {
      flex: 1; padding: 5px 9px; background: #111; border: 1px solid var(--line);
      border-radius: 4px; color: #e8c56a; font-size: 17px;
      font-family: var(--hebrew); direction: rtl; text-align: center;
    }
    #add-row button {
      background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 11px;
    }
    #add-row button:hover { color: var(--text); border-color: var(--dim); }

    #terms { overflow-y: auto; min-height: 0; padding: 8px 0 20px; }

    /* ---------- term card ---------- */

    .term {
      margin: 0 10px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }

    .term-head { display: flex; align-items: center; gap: 9px; padding: 8px 10px; }
    .term-swatch { width: 12px; height: 22px; border-radius: 3px; flex-shrink: 0; }
    .term-word { font-family: var(--hebrew); font-size: 20px; direction: rtl; }
    .term-counts { flex: 1; font-size: 11px; color: var(--muted); line-height: 1.4; }
    .term-counts b { color: var(--text); }
    .term-counts .narrowed { color: #e8c56a; }
    .term-remove {
      background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 15px; padding: 0 4px;
    }
    .term-remove:hover { color: #e06c6c; }

    .term-senses { border-top: 1px solid var(--line); padding: 6px 0 8px; }
    .term-senses .senses-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 10px 5px; font-size: 10px; color: var(--dim);
    }
    .term-senses .senses-head button {
      background: none; border: 1px solid var(--line); color: var(--dim);
      font-size: 9px; padding: 1px 6px; border-radius: 3px; cursor: pointer; margin-left: 4px;
    }
    .term-senses .senses-head button:hover { color: var(--text); }

    .sense-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 10px; cursor: pointer;
    }
    .sense-row:hover { background: #2c2c2c; }
    .sense-row input { margin: 0; cursor: pointer; }
    .sense-row .label { flex: 1; min-width: 0; }
    .sense-row .primary { font-size: 12px; }
    .sense-row .secondary { font-size: 10px; color: var(--dim); }
    .sense-row .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .sense-row.off .label, .sense-row.off .count { opacity: 0.4; }

    .term-forms { padding: 4px 10px 0; font-size: 10px; color: #555; }

    .note {
      margin: 6px 10px;
      padding: 6px 8px;
      background: #2a2318;
      border-left: 2px solid #c98b3a;
      font-size: 10px; line-height: 1.5; color: #c9a86a;
    }

    /* ---------- right ---------- */

    #right { display: grid; grid-template-rows: 1fr auto 260px; min-height: 0; }

    #map-wrap { position: relative; min-height: 0; background: #141414; overflow: hidden; }
    #map { display: block; width: 100%; height: 100%; }

    #map-caption {
      position: absolute; left: 12px; top: 10px;
      font-size: 11px; color: var(--muted);
      background: rgba(0,0,0,0.65); padding: 6px 10px; border-radius: 4px;
      line-height: 1.6; pointer-events: none; max-width: 620px;
    }
    #map-caption b { color: var(--text); }
    #map-caption .chip {
      display: inline-block; width: 8px; height: 8px; border-radius: 2px;
      margin: 0 4px 0 8px; vertical-align: middle;
    }

    #tooltip {
      position: absolute; background: rgba(0,0,0,0.92); border: 1px solid var(--line);
      border-radius: 4px; padding: 4px 8px; font-size: 11px;
      pointer-events: none; display: none; white-space: nowrap; z-index: 5;
    }

    #results-head {
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 7px 14px; font-size: 11px; color: var(--muted); background: var(--panel-2);
    }

    #results { overflow-y: auto; min-height: 0; padding: 4px 0 20px; }

    .book-head {
      position: sticky; top: 0; background: var(--bg); padding: 5px 14px 3px;
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--dim); border-bottom: 1px solid #262626;
    }

    .result-row {
      padding: 5px 14px; display: flex; gap: 10px; align-items: baseline;
      border-bottom: 1px solid #202020;
    }
    .result-row .dots { display: flex; gap: 3px; align-self: center; flex-shrink: 0; }
    .result-row .dot { width: 8px; height: 8px; border-radius: 50%; }
    .result-row .ref { color: var(--muted); font-size: 11px; width: 110px; flex-shrink: 0; }
    .result-row .he {
      font-family: var(--hebrew); font-size: 16px; direction: rtl; text-align: right;
      flex: 1; line-height: 1.6; color: #cfcfcf;
    }
    .result-row .he mark { background: none; color: #ffd479; font-weight: 600; }

    .empty { padding: 20px 14px; color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Meaning filter prototype<span>one colour per word · meanings narrow within a word</span></h1>

      <div class="scenarios" id="scenarios"></div>

      <div id="corpus-stat">measuring the corpus…</div>
    </header>

    <div id="body">
      <section id="terms-col">
        <div class="col-head">
          <h2>Words</h2>
          <div class="sub">Each word gets a colour. A word with more than one meaning can be narrowed; the colour does not change.</div>
          <div id="add-row">
            <input id="add-term" placeholder="הוסף מילה" spellcheck="false">
            <button id="add-btn">add</button>
          </div>
        </div>
        <div id="terms"></div>
      </section>

      <div id="right">
        <div id="map-wrap">
          <canvas id="map"></canvas>
          <div id="map-caption">loading the Tanakh…</div>
          <div id="tooltip"></div>
        </div>
        <div id="results-head">Results</div>
        <div id="results"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
