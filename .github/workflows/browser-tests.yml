# Runs the browser tests a pull request's changes can break (npm run test:browser).
# Screenshots stay local: only whoever made the change knows which states it touches.
name: Browser tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # A full run takes about 11 minutes.
    timeout-minutes: 30
    steps:
      # test:browser diffs against origin/main, so it needs the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # system-ui is the page's text font; the runner would draw it in DejaVu Sans, much wider
      # than the Mac's. Inter is the nearest free face.
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter
          mkdir -p ~/.config/fontconfig && cp .github/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
